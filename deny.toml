# cargo-deny: dependencies may only use permissive licenses, MPL-2.0 or LGPL. No GPL/AGPL dependencies.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "BSL-1.0", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016",
    "OFL-1.1", "Ubuntu-font-1.0",
    "LGPL-2.1-only", "LGPL-2.1-or-later", "LGPL-3.0-only", "LGPL-3.0-or-later",
]
[licenses.private]
ignore = true   # our own crates are AGPL-3.0-only (not allowed for dependencies)

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
